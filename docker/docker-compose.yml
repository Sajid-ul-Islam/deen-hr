services:
  backend:
    image: frappe/erpnext:v15
    restart: unless-stopped
    environment:
      - SITE_NAME=${SITE_NAME:-deenhr.localhost}
      - DB_PASSWORD=${DB_PASSWORD:-frappe}
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - ../deen_hr:/home/frappe/frappe-bench/apps/deen_hr

  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-mariadb_root_password}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:alpine
    restart: unless-stopped

  redis-queue:
    image: redis:alpine
    restart: unless-stopped

volumes:
  db-data:
  sites-data:
