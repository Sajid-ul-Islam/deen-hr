[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "deen_hr"
version = "0.0.1"
description = "Custom Frappe HR extensions and biometric integrations for DEEN HR"
authors = [
    { name = "Sajid Islam", email = "saajiidi@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0"
]

[project.optional-dependencies]
biometric = [
    "pyzk>=0.9",
    "schedule>=1.2.0"
]
